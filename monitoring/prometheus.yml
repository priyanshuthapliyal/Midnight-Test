global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: "midnight-node"
    static_configs:
      - targets: ["127.0.0.1:9615"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]